<!-- ECNet tab mark. One solid E, not four thin bars: at 16px the old glyph's
     1.4px gaps closed up and it read as a blob. Gradient is the light-theme
     --gradient-brand; the old mint is the dark-theme accent and washed the
     white out against browser chrome. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ecnet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c8f63"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#ecnet)"/>
  <path d="M9.6 8h13.2v3.9h-8.8v2.15h6.8v3.9h-6.8v2.15h8.8V24H9.6z" fill="#fff"/>
</svg>
